<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Tech Event - EventFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div class="max-w-2xl mx-auto my-20 p-8 bg-slate-800 rounded-3xl shadow-2xl border border-slate-700">
        <h2 class="text-3xl font-bold text-center mb-8 italic">Create New <span class="text-indigo-400">Tech Event</span></h2>
        
        <form id="eventForm" class="space-y-6">
          <div>
    <label class="block text-xs font-bold uppercase tracking-widest text-indigo-400 mb-2">Event Title</label>
    <input type="text" id="eventTitle" required placeholder="e.g. AI Innovation Summit" 
        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none transition text-white">
    

</div>

<script>
function saveEvent() {
    const title = document.getElementById('eventTitle').value;
    if (title) {
        // Get existing events or start a new list
        let events = JSON.parse(localStorage.getItem('myEvents')) || [];
        // Add the new title
        events.push(title);
        // Save back to storage
        localStorage.setItem('myEvents', JSON.stringify(events));
        
        alert("Event Created! Now go to Event Register page.");
        // Optional: window.location.href = "event_register.html";
    }
}
</script>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-indigo-400 mb-2">Date</label>
                    <input type="date" id="eventDate" required 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-indigo-400 mb-2">Location</label>
                    <input type="text" id="eventLocation" required placeholder="City, Country"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none transition">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-indigo-400 mb-2">Banner Image URL</label>
                <input type="url" id="eventImage" placeholder="https://images.unsplash.com/..."
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none transition">
            </div>
            <button id="Save" type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-bold uppercase tracking-widest transition">
                Save & Publish Event
            </button>
        </form>
    </div>
    <script>
    document.getElementById('eventForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const newEvent = {
            title: document.getElementById('eventTitle').value,
            date: document.getElementById('eventDate').value,
            location: document.getElementById('eventLocation').value,
            image: document.getElementById('eventImage').value || 'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?q=80&w=1000'
        };

        // Get existing events or initialize empty array
        const events = JSON.parse(localStorage.getItem('techEvents')) || [];
        events.push(newEvent);
        
        // Save back to local storage
        localStorage.setItem('techEvents', JSON.stringify(events));

        alert('Event Published Successfully!');
        window.location.href = "admin.html"; // Redirect back to admin dashboard after creating event
    });
    document.getElementById('Save').addEventListener('click', function() {
    // ... your existing code to save the event object ...

    // Increment Total Events Counter
    let totalEvents = parseInt(localStorage.getItem('totalEventsCount')) || 0;
    localStorage.setItem('totalEventsCount', totalEvents + 1);
});
</script>
   
</body>
</html>
