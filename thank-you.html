<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You - Eventora</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-6 text-center">
      <h1 class="text-3xl font-bold">Thank You!</h1>
    </div>
  </header>

  <!-- Confirmation Message -->
  <main class="flex items-center justify-center min-h-[70vh] px-4">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-lg text-center">
      <h2 class="text-2xl font-semibold mb-4">🎉 Your registration was successful!</h2>
      <p class="text-gray-600 mb-6">
        We’ve received your details and will get back to you soon. Check your inbox for confirmation.
      </p>
      <div class="flex flex-col sm:flex-row justify-center gap-4">
        <a href="index.html" class="bg-indigo-600 text-white px-6 py-2 rounded hover:bg-indigo-700 transition">
          Return to Home
        </a>
        <a href="events.html" class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700 transition">
          Browse Events
        </a>
      </div>
    </div>
  </main>

</body>
</html>
