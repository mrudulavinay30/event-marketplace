<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Event Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans">

    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-black italic uppercase tracking-tighter">
                Event<span class="text-indigo-500">FLOW</span> <span class="text-slate-500 text-sm font-normal ml-2">Admin Dashboard</span>
            </h1>
            <a href="create_event.html" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm font-bold transition">
                + New Event
            </a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-lg font-bold">Published Events</h2>
                <span id="eventCount" class="bg-slate-800 text-indigo-400 text-xs px-3 py-1 rounded-full font-bold">0 Events</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800/50 text-slate-400 text-[10px] uppercase tracking-widest font-black">
                            <th class="px-6 py-4">Event Details</th>
                            <th class="px-6 py-4">Date</th>
                            <th class="px-6 py-4">Location</th>
                            <th class="px-6 py-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800">
                        </tbody>
                </table>
            </div>
            
            <div id="emptyState" class="hidden p-20 text-center">
                <p class="text-slate-500 italic">No events found in the database.</p>
            </div>
        </div>
    </main>

    <script>
        function loadDashboard() {
            const tableBody = document.getElementById('tableBody');
            const eventCount = document.getElementById('eventCount');
            const emptyState = document.getElementById('emptyState');
            const events = JSON.parse(localStorage.getItem('techEvents')) || [];

            eventCount.innerText = `${events.length} Events`;

            if (events.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            tableBody.innerHTML = events.map((event, index) => `
                <tr class="hover:bg-slate-800/30 transition-colors group">
                    <td class="px-6 py-4">
                        <div class="flex items-center space-x-4">
                            <img src="${event.image}" class="w-12 h-12 rounded-lg object-cover border border-slate-700">
                            <div>
                                <p class="font-bold text-white">${event.title}</p>
                                <p class="text-xs text-slate-500">ID: #TF-0${index + 1}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-sm font-medium text-slate-300">
                        ${event.date}
                    </td>
                    <td class="px-6 py-4 text-sm text-slate-400">
                        ${event.location}
                    </td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="deleteEvent(${index})" class="text-slate-500 hover:text-red-400 transition-colors p-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function deleteEvent(index) {
            if(confirm('Are you sure you want to delete this event?')) {
                let events = JSON.parse(localStorage.getItem('techEvents'));
                events.splice(index, 1);
                localStorage.setItem('techEvents', JSON.stringify(events));
                loadDashboard();
            }
        }

        // Initial Load
        loadDashboard();
    </script>
</body>
</html>
