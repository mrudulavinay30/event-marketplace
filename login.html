<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechFlow 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center p-6">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-600/10 rounded-full blur-[120px]"></div>
    </div>

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black italic tracking-tighter uppercase text-white">
                TECH<span class="text-indigo-500">FLOW</span>
            </h1>
            <p class="text-slate-400 text-sm mt-2">Access your 2026 Event Dashboard</p>
        </div>

        <div class="glass border border-slate-800 p-8 rounded-[2rem] shadow-2xl">
            <div class="flex bg-slate-900/50 p-1 rounded-xl mb-8 border border-slate-800">
                <button id="userBtn" onclick="setRole('user')" class="flex-1 py-2 text-sm font-bold rounded-lg transition-all bg-indigo-600 text-white">
                    User
                </button>
                <button id="adminBtn" onclick="setRole('admin')" class="flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-white">
                    Admin
                </button>
            </div>

            <form id="loginForm" class="space-y-5">
                <input type="hidden" id="roleInput" value="user">
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Email Address</label>
                    <input type="email" required placeholder="name@company.com" 
                        class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Password</label>
                    <input type="password" required placeholder="••••••••" 
                        class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                </div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" class="rounded bg-slate-900 border-slate-700 text-indigo-600 mr-2">
                        <span class="text-slate-400">Remember me</span>
                    </label>
                    <a href="#" class="text-indigo-400 hover:underline">Forgot password?</a>
                </div>

                <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold transition-all transform active:scale-[0.98] shadow-lg shadow-indigo-500/20">
                    Sign In to <span id="roleText">User</span> Portal
                </button>
            </form>

            <p class="text-center text-slate-500 text-sm mt-8">
                Don't have an account? <a href="register.html" class="text-indigo-400 font-bold hover:underline">Register</a>
            </p>
        </div>

        <div class="text-center mt-6">
            <a href="index.html" class="text-slate-500 hover:text-white transition text-xs font-bold uppercase tracking-widest">
                ← Back to Home
            </a>
        </div>
    </div>

   <script>
    function setRole(role) {
        const userBtn = document.getElementById('userBtn');
        const adminBtn = document.getElementById('adminBtn');
        const roleInput = document.getElementById('roleInput');
        const roleText = document.getElementById('roleText');

        roleInput.value = role;

        if (role === 'admin') {
            adminBtn.classList.add('bg-indigo-600', 'text-white');
            adminBtn.classList.remove('text-slate-400');
            userBtn.classList.remove('bg-indigo-600', 'text-white');
            userBtn.classList.add('text-slate-400');
            roleText.innerText = 'Admin';
        } else {
            userBtn.classList.add('bg-indigo-600', 'text-white');
            userBtn.classList.remove('text-slate-400');
            adminBtn.classList.remove('bg-indigo-600', 'text-white');
            adminBtn.classList.add('text-slate-400');
            roleText.innerText = 'User';
        }
    }

    // --- MODIFIED REDIRECTION LOGIC BELOW ---
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevents the form from refreshing the page
        
        const role = document.getElementById('roleInput').value;
        
        if (role === 'admin') {
            // Redirects to admin.html
            window.location.href = 'admin.html';
        } else {
            // Redirects to index.html
            window.location.href = 'index.html';
        }
    });
</script>
</body>
</html>
