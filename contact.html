<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - Eventora</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-6 text-center">
      <h1 class="text-3xl font-bold">Contact Us</h1>
      <nav class="mt-4">
        <ul class="flex justify-center space-x-6 font-medium">
          <li><a href="index.html" class="hover:underline">Home</a></li>
          <li><a href="events.html" class="hover:underline">Events</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Contact Form -->
  <section class="max-w-2xl mx-auto my-12 bg-white p-8 rounded-xl shadow-md">
    <h2 class="text-2xl font-semibold text-center mb-6">We'd love to hear from you!</h2>

    <form action="https://formsubmit.co/shinigamil653@gmail.com" method="POST" class="space-y-6">
      
      <!-- Hidden settings -->
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_subject" value="New Eventora Contact">
      <input type="hidden" name="_next" value="http://192.168.1.26:5501/thank-you.html">

      <!-- Full Name -->
      <div>
        <label for="name" class="block mb-1 font-medium text-gray-700">Full Name</label>
        <input type="text" id="name" name="Name" placeholder="John Doe" required
          class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500" />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block mb-1 font-medium text-gray-700">Email Address</label>
        <input type="email" id="email" name="Email" placeholder="you@example.com" required
          class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500" />
      </div>

      <!-- Subject -->
      <div>
        <label for="subject" class="block mb-1 font-medium text-gray-700">Subject</label>
        <input type="text" id="subject" name="Subject" placeholder="Your Subject" required
          class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500" />
      </div>

      <!-- Message -->
      <div>
        <label for="message" class="block mb-1 font-medium text-gray-700">Message</label>
        <textarea id="message" name="Message" rows="5" placeholder="Tell us more..."
          class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500" required></textarea>
      </div>

      <!-- Submit -->
      <button type="submit"
        class="w-full bg-indigo-600 text-white font-semibold py-2 rounded hover:bg-indigo-700 transition">
        Send Message
      </button>
    </form>
  </section>

  <!-- Contact Info (Optional Section) -->
  <section class="max-w-2xl mx-auto my-12 bg-white p-8 rounded-xl shadow-md">
    <h3 class="text-xl font-semibold text-center mb-4">Other Ways to Reach Us</h3>
    <ul class="list-none space-y-4">
      <li><strong>Email:</strong> <a href="mailto:shinigamil653@gmail.com" class="text-blue-600 hover:underline">shinigamil653@gmail.com</a></li>
      <li><strong>Phone:</strong> +91 (123) 456-7890</li>
      <li><strong>Office:</strong> 123 Eventora St., Bengluru, India</li>
    </ul>
  </section>

</body>
</html>
